name: Cleanup Legacy Release Branch

on:
  push:
    branches:
      - custom

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[cleanup-legacy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy releases/2.6.4.2 branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref="heads/releases%2F2.6.4.2"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/git/refs/$encoded_ref")"
          if [[ "$status" == "204" || "$status" == "422" || "$status" == "404" ]]; then
            echo "Legacy branch removed or already absent (HTTP $status)."
          else
            cat response.json
            exit 1
          fi

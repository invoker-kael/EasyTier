name: EasyTier Custom Build & Release

on:
  workflow_dispatch:
    inputs:
      release_suffix:
        description: "Custom version suffix appended to upstream version"
        required: true
        default: "1"
        type: string
  push:
    branches:
      - custom

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_no_v: ${{ steps.meta.outputs.version_no_v }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' easytier/Cargo.toml | head -n1)"
          SUFFIX="${{ github.event.inputs.release_suffix }}"
          [[ -n "$SUFFIX" ]] || SUFFIX="1"
          VERSION_NO_V="${BASE_VERSION}.${SUFFIX}"
          echo "version=v${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Building custom version v${VERSION_NO_V} from $GITHUB_SHA"

  windows-x86_64:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-pc-windows-msvc
          gui: true
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: custom-windows-x86_64
          cache-targets: false
      - name: Copy Windows runtime files for GUI
        run: |
          find easytier/third_party/x86_64 -maxdepth 1 -type f \
            \( -name "*.dll" -o -name "*.sys" \) \
            -exec cp {} easytier-gui/src-tauri/ \;
      - name: Build Core and CLI
        run: |
          cargo build --release --locked \
            --target x86_64-pc-windows-msvc \
            --package easytier --features mimalloc
      - name: Build GUI
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target x86_64-pc-windows-msvc
      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $core = "target/x86_64-pc-windows-msvc/release"
          $stage = "stage-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$core/easytier-core.exe","$core/easytier-cli.exe" $stage
          Get-ChildItem "easytier/third_party/x86_64" -File |
            Where-Object { $_.Extension -in ".dll",".sys" } |
            Copy-Item -Destination $stage
          Set-Content -Path "$stage/SOURCE_COMMIT.txt" -Value "${{ needs.meta.outputs.source_sha }}"
          Compress-Archive -Path "$stage/*" -DestinationPath "$out/easytier-windows-x86_64-${{ needs.meta.outputs.version }}.zip" -Force
          $installers = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe -File
          if (-not $installers) { throw "No Windows NSIS installer was produced." }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName "$out/"
          }
      - uses: actions/upload-artifact@v5
        with:
          name: custom-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  linux-amd64:
    name: Linux amd64 + Docker
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: custom-linux-x86_64
          cache-targets: false
      - name: Build Core and CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --target x86_64-unknown-linux-musl \
            --package easytier --features jemalloc
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets stage-linux docker-context/easytier-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/easytier-{core,cli} stage-linux/
          cp stage-linux/easytier-{core,cli} docker-context/easytier-linux-x86_64/
          printf '%s\n' "${{ needs.meta.outputs.source_sha }}" > stage-linux/SOURCE_COMMIT.txt
          tar -C stage-linux -czf "release-assets/easytier-linux-x86_64-${{ needs.meta.outputs.version }}.tar.gz" .
          cp .github/workflows/Dockerfile docker-context/Dockerfile
      - uses: actions/upload-artifact@v5
        with:
          name: custom-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "DOCKERHUB_USERNAME is not configured"; exit 1; }
          [[ -n "$DOCKERHUB_TOKEN" ]] || { echo "DOCKERHUB_TOKEN is not configured"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/easytier-custom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/easytier-custom:${{ needs.meta.outputs.version_no_v }}
            ${{ secrets.DOCKERHUB_USERNAME }}/easytier-custom:${{ needs.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version_no_v }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  linux-gui-amd64:
    name: Linux GUI amd64
    needs: meta
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          gui: true
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: custom-linux-gui-x86_64
          cache-targets: false
      - name: Build GUI
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target x86_64-unknown-linux-gnu
      - name: Collect GUI artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find target/x86_64-unknown-linux-gnu/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
      - uses: actions/upload-artifact@v5
        with:
          name: custom-linux-gui-x86_64
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.arch }}
    needs: meta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: aarch64
          - target: armv7-linux-androideabi
            arch: armv7
          - target: i686-linux-android
            arch: i686
          - target: x86_64-linux-android
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34'
      - name: Setup Android environment
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> "$GITHUB_ENV"
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          gui: false
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: custom-android-${{ matrix.arch }}
          cache-targets: false
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd easytier-gui
          pnpm tauri android build --apk --target "${{ matrix.arch }}" --split-per-abi
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find easytier-gui/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v5
        with:
          name: custom-android-${{ matrix.arch }}
          path: release-assets/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, windows-x86_64, linux-amd64, linux-gui-amd64, android]
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Show release files
        shell: bash
        run: find release-assets -type f -maxdepth 3 -print
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: EasyTier ${{ needs.meta.outputs.version }}
          target_commitish: ${{ needs.meta.outputs.source_sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/**/*
          fail_on_unmatched_files: true
